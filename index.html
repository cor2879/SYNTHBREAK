// === HELPER FUNCTIONS ===
function clamp(v,mn,mx){if(isNaN(v)||v===undefined)return mn;return Math.max(mn,Math.min(mx,v));}

function makeBall(x,y,vx,vy){
  return {x:clamp(x,0,W),y:clamp(y,0,H),vx:vx||0,vy:vy||0,r:8,trail:[],stuck:false};
}

function makeBlock(col,row,type,hp){
  var x=BLOCK_LEFT+col*BLOCK_STEP;
  var y=FIELD_Y+16+row*(BLOCK_H+BLOCK_GAP);
  var btype='normal';
  if(type===9)btype='indestructible';
  else if(type===7)btype='invisible';
  else if(type===8)btype='explosive';
  else if(type===6)btype='moving';
  var bhp=hp;
  if(type===7)bhp=1;
  if(type===8)bhp=2;
  if(type===6)bhp=2;
  return {x:x,y:y,baseX:x,col:col,row:row,w:BLOCK_W,h:BLOCK_H,type:btype,hp:bhp,maxHp:bhp,alive:true,typeVal:type,moveSpeed:1.5+Math.random()*0.5};
}

function damageEnemy(en,dmg){
  if(!en||!en.alive)return;
  en.hp-=dmg;
  spawnParticles(en.x,en.y,5,en.color);
  addFloatingText(en.x,en.y,'-'+dmg,'#ffffff');
  if(en.hp<=0){
    en.alive=false;
    var pts=en.points||100;
    if(score2xActive)pts*=2;
    score+=pts;
    addFloatingText(en.x,en.y,'+'+pts,'#ffe600');
    spawnParticles(en.x,en.y,12,en.color);
    playSFX('enemy');

    if(en.type==='boss'&&continues<MAX_CONTINUES){
      continues++;
      notification={text:'+1 CONTINUE! ('+continues+'/'+MAX_CONTINUES+')',timer:180,color:'#00f5ff'};
    }
  }
}

function spawnEnemy(def){
  switch(def.t){
    case 'drifter':return makeDrifter(def.x,def.y);
    case 'patrol':return makePatrol(def.x,def.y,def.minY,def.maxY);
    case 'gunner':return makeGunner(def.x,def.y);
    case 'bomber':return makeBomber(def.x,def.y);
    case 'chaser':return makeChaser(def.x,def.y);
    case 'boss':return makeBoss(def.x,def.y,def.bossNum||1);

// === AUDIO ===
function initAudio(){
  if(audioCtx)return;
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain();
    masterGain.gain.value=0.08;
    masterGain.connect(audioCtx.destination);
  }catch(e){console.error('Audio init:',e);}
}

function playSFX(type,extra){
  if(!audioCtx||!sfxEnabled)return;
  try{
    var osc=audioCtx.createOscillator();
    var gain=audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    var now=audioCtx.currentTime;
    gain.gain.setValueAtTime(0.12,now);
    switch(type){
      case 'paddle':
        osc.type='sine';osc.frequency.setValueAtTime(880,now);
        gain.gain.exponentialRampToValueAtTime(0.001,now+0.05);
        osc.start(now);osc.stop(now+0.05);break;
      case 'wall':
        osc.type='sine';osc.frequency.setValueAtTime(660,now);
        gain.gain.exponentialRampToValueAtTime(0.001,now+0.03);
        osc.start(now);osc.stop(now+0.03);break;
      case 'block':
        var hp=extra||1;
        osc.type='sawtooth';osc.frequency.setValueAtTime(440+hp*80,now);
        gain.gain.exponentialRampToValueAtTime(0.001,now+0.12);
        osc.start(now);osc.stop(now+0.12);break;
      case 'life':
        osc.type='sine';osc.frequency.setValueAtTime(300,now);
        osc.frequency.exponentialRampToValueAtTime(80,now+0.8);
        gain.gain.exponentialRampToValueAtTime(0.001,now+0.8);
        osc.start(now);osc.stop(now+0.8);break;
      case 'levelcomplete':
        osc.type='sine';
        osc.frequency.setValueAtTime(523,now);
        osc.frequency.setValueAtTime(659,now+0.17);
        osc.frequency.setValueAtTime(784,now+0.34);
        gain.gain.exponentialRampToValueAtTime(0.001,now+0.5);
        osc.start(now);osc.stop(now+0.5);break;
      case 'powerup':
        osc.type='sine';osc.frequency.setValueAtTime(523,now);
        gain.gain.exponentialRampToValueAtTime(0.001,now+0.3);
        osc.start(now);osc.stop(now+0.3);
        // chord notes
        try{
          var o2=audioCtx.createOscillator();var g2=audioCtx.createGain();
          o2.connect(g2);g2.connect(audioCtx.destination);
          o2.type='sine';o2.frequency.setValueAtTime(659,now);
          g2.gain.setValueAtTime(0.08,now);g2.gain.exponentialRampToValueAtTime(0.001,now+0.3);
          o2.start(now);o2.stop(now+0.3);
        }catch(e2){}
        break;
      case 'enemydie':
        osc.type='square';osc.frequency.setValueAtTime(300,now);
        gain.gain.exponentialRampToValueAtTime(0.001,now+0.2);
        osc.start(now);osc.stop(now+0.2);break;
      default:
        osc.type='sine';osc.frequency.setValueAtTime(440,now);
        gain.gain.exponentialRampToValueAtTime(0.001,now+0.05);
        osc.start(now);osc.stop(now+0.05);
    }
  }catch(e){console.error('SFX:',e);}
}

// === LOAD LEVEL ===
function loadLevel(idx){
  try{
    blocks=[];enemies=[];enemyProjectiles=[];powerups=[];lasers=[];
    // Preserve any powerups already applied by the pre-level shop
    var savedPowerups=activePowerups.slice();
    var savedGhost=ghostActive,savedLaser=laserActive,savedScore2x=score2xActive;
    var savedBombHits=bombHits,savedShieldHP=shieldHP;
    var savedPaddleW=paddleW;
    // Reset for new level
    activePowerups=[];
    ghostActive=false;laserActive=false;score2xActive=false;
    bombHits=0;shieldHP=0;
    paddleW=mode==='normal'?80:70;
    // Restore shop powerups
    if(shopBought){
      activePowerups=savedPowerups;
      ghostActive=savedGhost;laserActive=savedLaser;score2xActive=savedScore2x;
      bombHits=savedBombHits;shieldHP=savedShieldHP;
      paddleW=savedPaddleW;
    }
    var data=LEVELS[clamp(idx,0,99)];
    if(!data)return;
    for(var r=0;r<data.length;r++){
      var row=data[r];
      for(var cc=0;cc<row.length;cc++){
        var val=row[cc];
        if(val===0)continue;
        var hp=1;
        if(val>=1&&val<=5)hp=val;
        if(val===6)hp=2;
        if(val===7)hp=1;
        if(val===8)hp=2;
        if(val===9)hp=999;
        blocks.push(makeBlock(cc,r,val,hp));
      }
    }
    // Enemies
    if(LEVEL_ENEMIES[idx]){
      var edefs=LEVEL_ENEMIES[idx];
      for(var ei=0;ei<edefs.length;ei++){
        enemies.push(spawnEnemy(edefs[ei]));
      }
    }
    // Boss levels (every 10th level: 9,19,29,...)
    if(BOSS_LEVELS[idx]){
      var bdefs=BOSS_LEVELS[idx];
      for(var bi=0;bi<bdefs.length;bi++){
        var bd=bdefs[bi];
        enemies.push(makeBoss(bd.x,bd.y,bd.bossNum));
      }
    }
    // Reset ball
    balls=[];
    var b=makeBall(paddleX+paddleW/2,paddleY-8,0,0);
    b.stuck=true;
    balls.push(b);
    ballStuck=true;
    zone=Math.floor(idx/10)+1;
    levelTimer=0;
    gameTime=0;
  }catch(e){console.error('loadLevel:',e);}
}

function launchBall(){
  if(!ballStuck||balls.length===0)return;
  var spd=mode==='normal'?5:6.5;
  var angle=(50+Math.random()*80)*Math.PI/180;
  balls[0].vx=spd*Math.cos(angle)*(Math.random()>0.5?1:-1);
  balls[0].vy=-spd*Math.sin(angle);
  balls[0].stuck=false;
  ballStuck=false;
}

function loseLife(){
  lives--;
  screenFlash={color:'rgba(255,0,0,0.35)',frames:8};
  playSFX('life');
  if(balls.length>0)spawnParticles(balls[0].x,balls[0].y,20,'#ff4444');
  if(lives<=0){
    if(continues>0){
      state='CONTINUE_SCREEN';
    } else {
      state='GAME_OVER';
      saveHighScore();
    }
    return;
  } else {
    balls=[];
    var b=makeBall(paddleX+paddleW/2,paddleY-8,0,0);
    b.stuck=true;
    balls.push(b);
    ballStuck=true;
  }
}

function checkLevelComplete(){
  var remaining=0;
  for(var i=0;i<blocks.length;i++){
    if(blocks[i].alive&&blocks[i].type!=='indestructible')remaining++;
  }
  var enemiesAlive=0;
  for(var i=0;i<enemies.length;i++){if(enemies[i].alive)enemiesAlive++;}
  if(remaining===0&&enemiesAlive===0){
    if(level>=99){
      state='VICTORY';
      saveHighScore();
      playSFX('levelcomplete');
      spawnParticles(240,320,40,'#ffff00');
    } else {
      state='LEVEL_COMPLETE';
      playSFX('levelcomplete');
      spawnParticles(240,320,25,'#00ff88');
    }
  }
}

// Powerup drop
function tryDropPowerup(x,y){
  var chance=mode==='normal'?0.18:0.12;
  if(Math.random()<chance){
    var def=POWERUP_DEFS[Math.floor(Math.random()*POWERUP_DEFS.length)];
    powerups.push({x:x-18,y:y,type:def.type,vy:1.5,w:36,h:16,color:def.color,label:def.label,alive:true});
  }
}

function applyPowerup(pu){
  playSFX('powerup');
  notification={text:pu.type+' ACTIVATED!',timer:120,color:pu.color};
  switch(pu.type){
    case 'WIDE':
      paddleW=Math.min(paddleW*1.5,200);
      activePowerups.push({type:'WIDE',remaining:12,duration:12,color:pu.color});
      break;
    case 'MULTI':
      for(var mi=0;mi<2;mi++){
        var nb=makeBall(balls[0]?balls[0].x:240,balls[0]?balls[0].y:300,0,0);
        var spd=mode==='normal'?5:6.5;
        var ang=(40+Math.random()*100)*Math.PI/180;
        nb.vx=spd*Math.cos(ang)*(Math.random()>0.5?1:-1);
        nb.vy=-spd*Math.sin(ang);
        nb.stuck=false;
        balls.push(nb);
      }
      break;
    case 'FAST':
      for(var fi=0;fi<balls.length;fi++){
        balls[fi].vx*=1.3;balls[fi].vy*=1.3;
      }
      activePowerups.push({type:'FAST',remaining:10,duration:10,color:pu.color});
      break;
    case 'SLOW':
      for(var si=0;si<balls.length;si++){
        balls[si].vx*=0.7;balls[si].vy*=0.7;
      }
      activePowerups.push({type:'SLOW',remaining:12,duration:12,color:pu.color});
      break;
    case 'LASER':
      laserActive=true;
      activePowerups.push({type:'LASER',remaining:10,duration:10,color:pu.color});
      break;
    case 'SHIELD':
      shieldHP=3;
      break;
    case 'LIFE':
      lives=Math.min(lives+1,9);
      break;
    case 'BOMB':
      bombHits=3;
      activePowerups.push({type:'BOMB',remaining:999,duration:999,color:pu.color});
      break;
    case 'GHOST':
      ghostActive=true;
      activePowerups.push({type:'GHOST',remaining:8,duration:8,color:pu.color});
      break;
    case 'SCORE2X':
      score2xActive=true;
      activePowerups.push({type:'SCORE2X',remaining:15,duration:15,color:pu.color});
      break;
  }
}

// === DRAWING HELPERS ===
function drawRoundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

function drawGrid(){
  ctx.save();
  ctx.strokeStyle='#330055';
  ctx.lineWidth=1;
  var vanX=240,vanY=350;
  // Horizontal perspective lines
  for(var i=0;i<12;i++){
    var yy=vanY+(i*30+gridOffset%30);
    if(yy<FIELD_Y||yy>H)continue;
    var spread=(yy-vanY)/200;
    ctx.beginPath();
    ctx.moveTo(vanX-spread*300,yy);
    ctx.lineTo(vanX+spread*300,yy);
    ctx.stroke();
  }
  // Vertical converging lines
  for(var j=-6;j<=6;j++){
    ctx.beginPath();
    ctx.moveTo(vanX,vanY);
    ctx.lineTo(vanX+j*80,H);
    ctx.stroke();
  }
  ctx.restore();
}

function drawStars(){
  ctx.save();
  ctx.fillStyle='#ffffff';
  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    ctx.globalAlpha=clamp(0.3+Math.sin(gameTime+i)*0.3,0,1);
    ctx.fillRect(s.x,s.y,s.s,s.s);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

function updateStars(dt){
  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    s.y+=s.sp;
    if(s.y>H){s.y=0;s.x=Math.random()*W;}
  }
}

function drawBlock(b){
  try{
    ctx.save();
    var dx=b.x,dy=b.y;
    if(b.type==='moving'){
      dx=b.baseX+Math.sin(gameTime*b.moveSpeed)*20;
      b.x=clamp(dx,0,W-BLOCK_W);
    }
    if(b.type==='invisible'){
      // Check distance to nearest ball
      var minDist=9999;
      for(var bi=0;bi<balls.length;bi++){
        var ddx=balls[bi].x-(b.x+BLOCK_W/2);
        var ddy=balls[bi].y-(b.y+BLOCK_H/2);
        var dist=Math.sqrt(ddx*ddx+ddy*ddy);
        if(dist<minDist)minDist=dist;
      }
      ctx.globalAlpha=minDist<80?1.0:0.15;
    }
    var col;
    if(b.type==='indestructible'){
      col='#444444';
    } else if(b.type==='explosive'){
      col='#ff4400';
    } else {
      col=HP_COLORS[clamp(b.hp,1,5)]||'#00cccc';
    }
    ctx.fillStyle=col;
    ctx.fillRect(b.x,b.y,BLOCK_W,BLOCK_H);
    // Border
    if(b.type==='indestructible'){
      ctx.strokeStyle='#888888';ctx.lineWidth=2;
    } else if(b.type==='explosive'){
      ctx.strokeStyle='#ffaa00';ctx.lineWidth=2;
    } else if(b.type==='hard'){
      ctx.strokeStyle='#ffffff';ctx.lineWidth=3;
    } else {
      ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=1;
    }
    ctx.strokeRect(b.x,b.y,BLOCK_W,BLOCK_H);
    // HP dots for hp > 1
    if(b.hp>1&&b.hp<6&&b.type!=='indestructible'){
      ctx.fillStyle='#ffffff';
      for(var d=0;d<Math.min(b.hp,5);d++){
        ctx.fillRect(b.x+3+d*4,b.y+BLOCK_H-5,2,2);
      }
    }
    ctx.restore();
  }catch(e){
    ctx.save();ctx.fillStyle='#555555';ctx.fillRect(b.x,b.y,BLOCK_W,BLOCK_H);ctx.restore();
  }
}

function drawEnemy(en){
  try{
    ctx.save();
    ctx.fillStyle=en.color;
    ctx.strokeStyle='#ffffff';
    ctx.lineWidth=2;
    var cx=en.x,cy=en.y,sz=en.size/2;
    switch(en.type){
      case 'drifter': // triangle
        ctx.beginPath();
        ctx.moveTo(cx,cy-sz);ctx.lineTo(cx+sz,cy+sz);ctx.lineTo(cx-sz,cy+sz);
        ctx.closePath();ctx.fill();ctx.stroke();break;
      case 'patrol': // hexagon
        ctx.beginPath();
        for(var hi=0;hi<6;hi++){var a=hi*Math.PI/3-Math.PI/6;ctx.lineTo(cx+Math.cos(a)*sz,cy+Math.sin(a)*sz);}
        ctx.closePath();ctx.fill();ctx.stroke();break;
      case 'gunner': // diamond
        ctx.beginPath();
        ctx.moveTo(cx,cy-sz);ctx.lineTo(cx+sz,cy);ctx.lineTo(cx,cy+sz);ctx.lineTo(cx-sz,cy);
        ctx.closePath();ctx.fill();ctx.stroke();break;
      case 'bomber': // circle with X
        ctx.beginPath();ctx.arc(cx,cy,sz,0,Math.PI*2);ctx.fill();ctx.stroke();
        ctx.beginPath();ctx.moveTo(cx-sz*0.5,cy-sz*0.5);ctx.lineTo(cx+sz*0.5,cy+sz*0.5);ctx.stroke();
        ctx.beginPath();ctx.moveTo(cx+sz*0.5,cy-sz*0.5);ctx.lineTo(cx-sz*0.5,cy+sz*0.5);ctx.stroke();
        break;
      case 'chaser': // star
        ctx.beginPath();
        for(var si=0;si<10;si++){
          var ra=si%2===0?sz:sz*0.5;
          var sa=si*Math.PI/5-Math.PI/2;
          ctx.lineTo(cx+Math.cos(sa)*ra,cy+Math.sin(sa)*ra);
        }
        ctx.closePath();ctx.fill();ctx.stroke();break;
      case 'boss': // large pulsing octagon with HP bar
        var bsz=en.size/2*(0.9+Math.sin(gameTime*4)*0.1);
        ctx.lineWidth=3;
        ctx.strokeStyle='#ff0066';
        ctx.fillStyle=en.color;
        ctx.beginPath();
        for(var bi8=0;bi8<8;bi8++){var a8=bi8*Math.PI/4+(en.angle||0);ctx.lineTo(cx+Math.cos(a8)*bsz,cy+Math.sin(a8)*bsz);}
        ctx.closePath();ctx.fill();ctx.stroke();
        // inner ring
        ctx.beginPath();
        ctx.arc(cx,cy,bsz*0.4,0,Math.PI*2);
        ctx.fillStyle='#ffffff';ctx.fill();
        // HP bar above boss
        ctx.fillStyle='#330000';ctx.fillRect(cx-24,cy-bsz-10,48,6);
        ctx.fillStyle='#ff2d78';ctx.fillRect(cx-24,cy-bsz-10,48*(en.hp/en.maxHp),6);
        ctx.strokeStyle='#ff6699';ctx.lineWidth=1;ctx.strokeRect(cx-24,cy-bsz-10,48,6);
        break;
    }
    ctx.restore();
  }catch(e){
    ctx.save();ctx.fillStyle='#ff0000';ctx.fillRect(en.x-10,en.y-10,20,20);ctx.restore();
  }
}

function drawButton(btn,hovered){
  ctx.save();
  ctx.fillStyle=hovered?'#2a0050':'#1a0030';
  drawRoundRect(btn.x,btn.y,btn.w,btn.h,6);
  ctx.fill();
  ctx.strokeStyle=btn.borderColor||'#00f5ff';
  ctx.lineWidth=hovered?3:2;
  drawRoundRect(btn.x,btn.y,btn.w,btn.h,6);
  ctx.stroke();
  ctx.fillStyle='#ffffff';
  ctx.font='bold 14px "Courier New",Courier,monospace';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(btn.label,btn.x+btn.w/2,btn.y+btn.h/2);
  ctx.restore();
}

function isInside(mx,my,btn){
  return mx>=btn.x&&mx<=btn.x+btn.w&&my>=btn.y&&my<=btn.y+btn.h;
}

// === UPDATE ===
function update(dt){
  gameTime+=dt;
  gridOffset+=dt*30;
  updateStars(dt);

  if(state==='PLAYING'){
    levelTimer+=dt;
    // Hard mode timer
    if(mode==='hard'&&levelTimer>120){
      loseLife();
      return;
    }
    // Update paddle
    var targetX=paddleX;
    if(keysDown['ArrowLeft']||keysDown['KeyA'])targetX-=8;
    if(keysDown['ArrowRight']||keysDown['KeyD'])targetX+=8;
    // Mouse control: smooth follow
    var canvasRect=c.getBoundingClientRect();
    var localMX=mouseX;
    targetX=localMX-paddleW/2;
    if(keysDown['ArrowLeft']||keysDown['KeyA'])targetX=paddleX-8;
    if(keysDown['ArrowRight']||keysDown['KeyD'])targetX=paddleX+8;
    paddleX=clamp(targetX,0,W-paddleW);

    if(paddleGlow>0)paddleGlow-=0.5;

    // Update balls
    for(var bi=balls.length-1;bi>=0;bi--){
      var ball=balls[bi];
      if(ball.stuck){
        ball.x=paddleX+paddleW/2;
        ball.y=paddleY-ball.r;
        continue;
      }
      // Trail
      ball.trail.push({x:ball.x,y:ball.y});
      if(ball.trail.length>8)ball.trail.shift();

      ball.x+=ball.vx;
      ball.y+=ball.vy;

      // Wall collisions
      if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx);playSFX('wall');}
      if(ball.x+ball.r>W){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx);playSFX('wall');}
      if(ball.y-ball.r<HUD_H){ball.y=HUD_H+ball.r;ball.vy=Math.abs(ball.vy);playSFX('wall');}
      // Bottom
      if(ball.y+ball.r>H){
        if(shieldHP>0){
          ball.vy=-Math.abs(ball.vy);
          ball.y=H-ball.r;
          shieldHP--;
          playSFX('wall');
        } else {
          balls.splice(bi,1);
          if(balls.length===0)loseLife();
          continue;
        }
      }

      // Paddle collision
      if(ball.vy>0&&ball.y+ball.r>=paddleY&&ball.y+ball.r<=paddleY+paddleH+4&&ball.x>=paddleX-4&&ball.x<=paddleX+paddleW+4){
        var hitPos=(ball.x-(paddleX+paddleW/2))/(paddleW/2);
        hitPos=clamp(hitPos,-1,1);
        var angle=hitPos*60*Math.PI/180;
        var speed=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);
        speed=clamp(speed,3,12);
        ball.vx=speed*Math.sin(angle);
        ball.vy=-Math.abs(speed*Math.cos(angle));
        ball.y=paddleY-ball.r;
        paddleGlow=10;
        playSFX('paddle');
      }

      // Block collision
      for(var bki=0;bki<blocks.length;bki++){
        var blk=blocks[bki];
        if(!blk.alive)continue;
        // Rect vs circle
        var closestX=clamp(ball.x,blk.x,blk.x+blk.w);
        var closestY=clamp(ball.y,blk.y,blk.y+blk.h);
        var distX=ball.x-closestX;
        var distY=ball.y-closestY;
        var distSq=distX*distX+distY*distY;
        if(distSq<ball.r*ball.r){
          if(!ghostActive){
            // Determine side
            var overlapL=ball.x+ball.r-blk.x;
            var overlapR=blk.x+blk.w-(ball.x-ball.r);
            var overlapT=ball.y+ball.r-blk.y;
            var overlapB=blk.y+blk.h-(ball.y-ball.r);
            var minOverlap=Math.min(overlapL,overlapR,overlapT,overlapB);
            if(minOverlap===overlapL||minOverlap===overlapR)ball.vx=-ball.vx;
            else ball.vy=-ball.vy;
          }
          // Damage
          {
            var dmg=1;
            var isIndestr=(blk.type==='indestructible');
            if(isIndestr){
              if(!blk.laserHp)blk.laserHp=2;
              blk.laserHp--;
              spawnParticles(blk.x+BLOCK_W/2,blk.y+BLOCK_H/2,4,'#aaaaaa');
              if(blk.laserHp<=0){
                blk.alive=false;
                var lp2=50*zone;if(score2xActive)lp2*=2;
                score+=lp2;
                addFloatingText(blk.x+BLOCK_W/2,blk.y,'+'+lp2,'#cccccc');
                spawnParticles(blk.x+BLOCK_W/2,blk.y+BLOCK_H/2,10,'#888888');
              }
              lasers.splice(li,1);break;
            }
            var dmgUnused=1;
            var isBomb=bombHits>0;
          if(isBomb){
            dmg=blk.hp;
            bombHits--;
            if(bombHits<=0){
              for(var ap=activePowerups.length-1;ap>=0;ap--){if(activePowerups[ap].type==='BOMB')activePowerups.splice(ap,1);}
            }
            for(var bni=0;bni<blocks.length;bni++){
              var nblk=blocks[bni];
              if(!nblk.alive||nblk===blk)continue; // bomb can hit indestructible
              if(Math.abs(nblk.col-blk.col)<=1&&Math.abs(nblk.row-blk.row)<=1){
                nblk.hp=0;nblk.alive=false;
                var bp=nblk.maxHp*10*zone;if(score2xActive)bp*=2;
                score+=bp;
                addFloatingText(nblk.x+BLOCK_W/2,nblk.y,'+'+bp,'#ff8800');
                spawnParticles(nblk.x+BLOCK_W/2,nblk.y+BLOCK_H/2,6,'#ff8800');              }
            }
            // Bomb also blasts enemies within 90px of hit block center
            var bombCX=blk.x+BLOCK_W/2,bombCY=blk.y+BLOCK_H/2;
            for(var beni=0;beni<enemies.length;beni++){
              var ben=enemies[beni];
              if(!ben.alive)continue;
              var bdx=ben.x-bombCX,bdy=ben.y-bombCY;
              if(Math.sqrt(bdx*bdx+bdy*bdy)<90){
                damageEnemy(ben,3);
              }
            }
          }
          blk.hp-=dmg;
            if(blk.hp<=0){
              blk.alive=false;
              var pts=blk.maxHp*10*zone;
              if(score2xActive)pts*=2;
              score+=pts;
              addFloatingText(blk.x+BLOCK_W/2,blk.y,'+'+pts);
              spawnParticles(blk.x+BLOCK_W/2,blk.y+BLOCK_H/2,8,HP_COLORS[clamp(blk.maxHp,1,5)]);
              playSFX('block',blk.maxHp);
              tryDropPowerup(blk.x+BLOCK_W/2,blk.y);
              // Explosive
              if(blk.type==='explosive'){
                for(var ni=0;ni<blocks.length;ni++){
                  var nb=blocks[ni];
                  if(!nb.alive||nb===blk)continue;
                  if(Math.abs(nb.col-blk.col)<=1&&Math.abs(nb.row-blk.row)<=1){
                    nb.hp--;
                    if(nb.hp<=0){
                      nb.alive=false;
                      var p2=nb.maxHp*10*zone;
                      if(score2xActive)p2*=2;
                      score+=p2;
                      addFloatingText(nb.x+BLOCK_W/2,nb.y,'+'+p2);
                      spawnParticles(nb.x+BLOCK_W/2,nb.y+BLOCK_H/2,6,'#ff4400');
                    }
                  }
                }
              }
              // Combo
              var now=performance.now();
              if(now-lastBreakTime<500)combo++;
              else combo=1;
              lastBreakTime=now;
              if(combo>=3){
                addFloatingText(240,FIELD_Y+30,'COMBO \u00d7'+combo+'!','#ffff00');
              }
            } else {
              playSFX('block',blk.hp);
            }
          }
          if(!ghostActive)break;
        }
      }

      // Enemy collision
      for(var ei=0;ei<enemies.length;ei++){
        var en=enemies[ei];
        if(!en.alive)continue;
        var edx=ball.x-en.x,edy=ball.y-en.y;
        var edist=Math.sqrt(edx*edx+edy*edy);
        if(edist<en.size/2+ball.r){
          ball.vx=-ball.vx;ball.vy=-ball.vy;
          var prevAlive=en.alive;
          damageEnemy(en,1);
          if(prevAlive&&!en.alive)tryDropPowerup(en.x,en.y);
          break;
        }
      }
    }

    // Update enemies
    for(var ei=0;ei<enemies.length;ei++){
      var en=enemies[ei];
      if(!en.alive)continue;
      switch(en.type){
        case 'drifter':
          en.x+=en.vx;
          if(en.x<20||en.x>W-20)en.vx=-en.vx;
          break;
        case 'patrol':
          en.y+=en.vy;
          if(en.y<en.minY||en.y>en.maxY)en.vy=-en.vy;
          break;
        case 'gunner':
          en.shootTimer-=dt;
          if(en.shootTimer<=0){
            en.shootTimer=3+Math.random()*2;
            var targetBX=balls.length>0?balls[0].x:paddleX+paddleW/2;
            var dx2=targetBX-en.x;
            var dy2=H-en.y;
            var d2=Math.sqrt(dx2*dx2+dy2*dy2)||1;
            enemyProjectiles.push({x:en.x,y:en.y,vx:dx2/d2*3,vy:dy2/d2*3,alive:true});
          }
          break;
        case 'bomber':
          en.x+=en.vx;
          if(en.x<20||en.x>W-20)en.vx=-en.vx;
          en.shootTimer-=dt;
          if(en.shootTimer<=0){
            en.shootTimer=5;
            enemyProjectiles.push({x:en.x,y:en.y,vx:0,vy:2.5,alive:true});
          }
          break;
        case 'chaser':
          if(balls.length>0){
            var cdx=balls[0].x-en.x,cdy=balls[0].y-en.y;
            var cdist=Math.sqrt(cdx*cdx+cdy*cdy)||1;
            en.x+=cdx/cdist*0.8;
            en.y+=cdy/cdist*0.8;
          }
          en.x=clamp(en.x,20,W-20);
          en.y=clamp(en.y,HUD_H+20,H-60);
          break;
        case 'boss':
          en.angle=(en.angle||0)+0.02;
          // Phase-based movement: bounce left-right + gentle vertical drift
          en.x+=en.vx;
          if(en.x<en.size/2+10||en.x>W-en.size/2-10){en.vx=-en.vx;en.phase++;}
          en.subVy=en.subVy||0.6;
          en.y+=Math.sin(gameTime*(0.8+en.bossNum*0.1))*en.subVy;
          en.y=clamp(en.y,HUD_H+40,HUD_H+180);
          en.shootTimer-=dt;
          if(en.shootTimer<=0){
            en.shootTimer=1.5-Math.min(en.bossNum*0.1,0.8);
            // Fire 3-way spread
            for(var bsa=-1;bsa<=1;bsa++){
              var spd=3+(en.bossNum*0.2);
              var ang=Math.PI/2+bsa*(Math.PI/8);
              enemyProjectiles.push({x:en.x,y:en.y+en.size/2,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,alive:true,boss:true});
            }
          }
          break;
      }
    }

    // Update enemy projectiles
    for(var pi=enemyProjectiles.length-1;pi>=0;pi--){
      var pr=enemyProjectiles[pi];
      pr.x+=pr.vx;pr.y+=pr.vy;
      if(pr.y>H||pr.y<0||pr.x<0||pr.x>W){enemyProjectiles.splice(pi,1);continue;}
      // Check vs paddle
      if(pr.y>=paddleY&&pr.y<=paddleY+paddleH&&pr.x>=paddleX&&pr.x<=paddleX+paddleW){
        enemyProjectiles.splice(pi,1);
        loseLife();
        continue;
      }
    }

    // Update lasers
    if(laserCooldown>0)laserCooldown-=dt;
    // Auto-fire laser when mouse held down
    if(mouseHeld&&state==='PLAYING'&&laserActive&&laserCooldown<=0){
      lasers.push({x:paddleX+paddleW*0.25,y:paddleY-4,vy:-10});
      lasers.push({x:paddleX+paddleW*0.75,y:paddleY-4,vy:-10});
      laserCooldown=0.18;
    }
    for(var li=lasers.length-1;li>=0;li--){
      var las=lasers[li];
      las.y-=(las.vy?Math.abs(las.vy):8);
      if(las.y<HUD_H){lasers.splice(li,1);continue;}
      // Hit blocks
      for(var bki=0;bki<blocks.length;bki++){
        var blk=blocks[bki];
        if(!blk.alive)continue;
        if(las.x>=blk.x&&las.x<=blk.x+blk.w&&las.y>=blk.y&&las.y<=blk.y+blk.h){
          if(blk.type!=='indestructible'){
            blk.hp--;
            if(blk.hp<=0){
              blk.alive=false;
              var pts=blk.maxHp*10*zone;
              if(score2xActive)pts*=2;
              score+=pts;
              addFloatingText(blk.x+BLOCK_W/2,blk.y,'+'+pts);
              spawnParticles(blk.x+BLOCK_W/2,blk.y+BLOCK_H/2,6,'#ff00ff');
              playSFX('block',blk.maxHp);
              tryDropPowerup(blk.x+BLOCK_W/2,blk.y);
            }
          }
          lasers.splice(li,1);
          break;
        }
      }
      if(!lasers[li])continue;
      // Laser hits enemies (including bosses)
      for(var lei=0;lei<enemies.length;lei++){
        var len=enemies[lei];
        if(!len.alive)continue;
        var ldx=las.x-len.x,ldy=las.y-len.y;
        if(Math.sqrt(ldx*ldx+ldy*ldy)<len.size/2+3){
          damageEnemy(len,1);
          lasers.splice(li,1);
          break;
        }
      }
    }

    // Update powerups
    for(var pi=powerups.length-1;pi>=0;pi--){
      var pu=powerups[pi];
      if(!pu.alive){powerups.splice(pi,1);continue;}
      pu.y+=pu.vy;
      if(pu.y>H){powerups.splice(pi,1);continue;}
      if(pu.y+pu.h>=paddleY&&pu.y<=paddleY+paddleH&&pu.x+pu.w>=paddleX&&pu.x<=paddleX+paddleW){
        pu.alive=false;
        applyPowerup(pu);
      }
    }

    // Update active powerups
    for(var api=activePowerups.length-1;api>=0;api--){
      if(activePowerups[api].type!=='BOMB'&&activePowerups[api].type!=='MAGNET')
        activePowerups[api].remaining-=dt;
      if(activePowerups[api].remaining<=0){
        var apt=activePowerups[api].type;
        if(apt==='WIDE')paddleW=mode==='normal'?80:70;
        if(apt==='GHOST')ghostActive=false;
        if(apt==='LASER')laserActive=false;
        if(apt==='SCORE2X')score2xActive=false;
        if(apt==='FAST'){
          for(var fi=0;fi<balls.length;fi++){
            var spd=Math.sqrt(balls[fi].vx*balls[fi].vx+balls[fi].vy*balls[fi].vy);
            if(spd>0){var ns=(mode==='normal'?5:6.5);balls[fi].vx*=ns/spd;balls[fi].vy*=ns/spd;}
          }
        }
        if(apt==='SLOW'){
          for(var si=0;si<balls.length;si++){
            var spd2=Math.sqrt(balls[si].vx*balls[si].vx+balls[si].vy*balls[si].vy);
            if(spd2>0){var ns2=(mode==='normal'?5:6.5);balls[si].vx*=ns2/spd2;balls[si].vy*=ns2/spd2;}
          }
        }
        activePowerups.splice(api,1);
      }
    }

    // Update particles
    for(var pi=particles.length-1;pi>=0;pi--){
      var p=particles[pi];
      p.x+=p.vx;p.y+=p.vy;p.life--;
      if(p.life<=0)particles.splice(pi,1);
    }

    // Update floating texts
    for(var fi=floatingTexts.length-1;fi>=0;fi--){
      var ft=floatingTexts[fi];
      ft.y-=0.8;ft.life--;
      if(ft.life<=0)floatingTexts.splice(fi,1);
    }

    // Notification
    if(notification.timer>0)notification.timer--;

    // Screen flash
    if(screenFlash&&screenFlash.frames>0)screenFlash.frames--;

    // Combo reset
    if(performance.now()-lastBreakTime>500)combo=0;

    checkLevelComplete();
  }

  if(state==='ZONE_INTRO'){
    zoneIntroTimer-=dt;
    if(zoneIntroTimer<=0){
      state='PLAYING';
      loadLevel(level);
    }
  }
}

// === RENDER ===
function render(){
  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
  ctx.shadowColor='transparent';

  if(state==='CONTINUE_SCREEN'){
    renderContinueScreen();
  } else if(state==='SHOP'){
    renderShop();
  } else if(state==='MENU'){
    renderMenu();
  } else if(state==='HOW_TO_PLAY'){
    renderHowToPlay();
  } else if(state==='HIGH_SCORES'){
    renderHighScores();
  } else if(state==='PLAYING'||state==='PAUSED'){
    renderPlaying();
    if(state==='PAUSED')renderPause();
  } else if(state==='LEVEL_COMPLETE'){
    renderPlaying();
    renderLevelComplete();
  } else if(state==='GAME_OVER'){
    renderGameOver();
  } else if(state==='VICTORY'){
    renderVictory();
  } else if(state==='ZONE_INTRO'){
    renderZoneIntro();
  }
}

  ctx.font='14px "Courier New",Courier,monospace';

  menuButtons=[
    {x:140,y:310,w:200,h:40,label:'NORMAL MODE',borderColor:'#00f5ff',action:function(){mode='normal';startGame();}},

  ctx.font='bold 28px "Courier New",Courier,monospace';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('HOW TO PLAY',240,40);
  ctx.fillStyle='#ffffff';
  ctx.font='13px "Courier New",Courier,monospace';
  ctx.textAlign='left';
  var lines=[
    'CONTROLS:',
    '  Mouse, Touch, or Arrows - Move paddle',
    '  Tap / Space - Launch ball',
    '  P / Escape - Pause',
    '  Tap-hold / Z - Fire laser (with powerup)',
    '',
    'POWERUPS:',
    '  WIDE  - Wider paddle (12s)',
    '  x3    - Split into 3 balls',
    '  FAST  - Speed up (10s)',
    '  SLOW  - Slow down (12s)',
    '  Laser - Shoot lasers (10s)',
    '  Shield- Bottom barrier (3 hits)',
    '  Heart - Extra life',

function renderPlaying(){
  ctx.save();
  // Background
  ctx.fillStyle='#0a0010';
  ctx.fillRect(0,FIELD_Y,W,FIELD_H);
  drawGrid();
  drawStars();

  // HUD
  ctx.fillStyle='#110022';
  ctx.fillRect(0,0,W,HUD_H);
  ctx.strokeStyle='#330055';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,HUD_H);ctx.lineTo(W,HUD_H);ctx.stroke();
  // Zone/Level
  ctx.fillStyle='#00f5ff';
  ctx.font='13px "Courier New",Courier,monospace';
  ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText('ZONE '+zone+' \u2022 LVL '+(level+1),10,HUD_H/2);
  ctx.fillStyle=continues>0?'#00f5ff':'#ff4444';
  ctx.font='10px "Courier New",Courier,monospace';
  ctx.fillText('CONT:'+continues+'/3',10,HUD_H-6);
  // Score
  ctx.fillStyle='#ffe600';
  ctx.font='bold 14px "Courier New",Courier,monospace';
  ctx.textAlign='center';
  ctx.fillText('SCORE: '+score,W/2,HUD_H/2);
  // Lives
  ctx.fillStyle='#ff2d78';
  ctx.textAlign='right';
  for(var li=0;li<Math.min(lives,9);li++){
    ctx.beginPath();
    ctx.arc(W-20-li*16,HUD_H/2,5,0,Math.PI*2);
    ctx.fill();
  }
  // SFX toggle
  ctx.fillStyle=sfxEnabled?'#00f5ff':'#333333';
  ctx.font='12px "Courier New",Courier,monospace';
  ctx.textAlign='right';
  ctx.fillText(sfxEnabled?'SFX':'SFX',W-10,14);

  // Active powerups below HUD
  for(var api=0;api<activePowerups.length;api++){
    var ap=activePowerups[api];
    var ax=10+api*22;
    ctx.fillStyle=ap.color;
    ctx.fillRect(ax,HUD_H+2,14,14);
    // depleting bar
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(ax,HUD_H+17,14,3);
    ctx.fillStyle=ap.color;
    var bw=14*(ap.remaining/ap.duration);
    ctx.fillRect(ax,HUD_H+17,clamp(bw,0,14),3);
  }

  // Shield
  if(shieldHP>0){
    ctx.save();
    ctx.strokeStyle='#00ff44';
    ctx.lineWidth=3;
    ctx.globalAlpha=0.5+Math.sin(gameTime*4)*0.2;
    ctx.beginPath();ctx.moveTo(0,H-2);ctx.lineTo(W,H-2);ctx.stroke();
    ctx.globalAlpha=1;
    ctx.restore();
  }

  // Blocks
  for(var bi=0;bi<blocks.length;bi++){
    if(blocks[bi].alive)drawBlock(blocks[bi]);
  }

  // Enemies
  for(var ei=0;ei<enemies.length;ei++){
    if(enemies[ei].alive)drawEnemy(enemies[ei]);
  }

  // Enemy projectiles
  ctx.save();
  ctx.fillStyle='#ff4444';
  for(var pi=0;pi<enemyProjectiles.length;pi++){
    var pr=enemyProjectiles[pi];
    ctx.beginPath();ctx.arc(pr.x,pr.y,4,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();

  // Powerup capsules
  for(var pi=0;pi<powerups.length;pi++){
    var pu=powerups[pi];
    if(!pu.alive)continue;
    ctx.save();
    ctx.fillStyle=pu.color;
    drawRoundRect(pu.x,pu.y,pu.w,pu.h,5);
    ctx.fill();
    ctx.fillStyle='#000000';
    ctx.font='bold 11px "Courier New",Courier,monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(pu.label,pu.x+pu.w/2,pu.y+pu.h/2);
    ctx.restore();
  }

  // Lasers
  ctx.save();
  ctx.fillStyle='#ff00ff';
  ctx.shadowBlur=8;ctx.shadowColor='#ff00ff';
  for(var li=0;li<lasers.length;li++){
    ctx.fillRect(lasers[li].x-2,lasers[li].y,4,12);
  }
  ctx.shadowBlur=0;ctx.shadowColor='transparent';
  ctx.restore();

  // Paddle
  ctx.save();
  if(paddleGlow>0){ctx.shadowBlur=clamp(paddleGlow,0,15);ctx.shadowColor='#00f5ff';}
  ctx.fillStyle='#004466';
  drawRoundRect(paddleX,paddleY,paddleW,paddleH,6);
  ctx.fill();
  ctx.strokeStyle='#00f5ff';ctx.lineWidth=2;
  drawRoundRect(paddleX,paddleY,paddleW,paddleH,6);
  ctx.stroke();
  ctx.shadowBlur=0;ctx.shadowColor='transparent';
  ctx.restore();

  // Balls
  for(var bi=0;bi<balls.length;bi++){
    var ball=balls[bi];
    ctx.save();
    // Trail
    for(var ti=0;ti<ball.trail.length;ti++){
      var t=ball.trail[ti];
      var alpha=clamp((ti/ball.trail.length)*0.4,0,0.4);
      ctx.globalAlpha=alpha;
      ctx.fillStyle='#00ffff';
      ctx.beginPath();ctx.arc(t.x,t.y,clamp(ball.r*0.6,1,6),0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    // Ball glow
    ctx.shadowBlur=15;ctx.shadowColor='#00ffff';
    ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.shadowColor='transparent';
    ctx.restore();
  }

  // Particles
  ctx.save();
  for(var pi=0;pi<particles.length;pi++){
    var p=particles[pi];
    ctx.globalAlpha=clamp(p.life/p.maxLife,0,1);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,clamp(p.size,0.5,5),0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore();

  // Floating texts
  ctx.save();
  ctx.font='bold 13px "Courier New",Courier,monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(var fi=0;fi<floatingTexts.length;fi++){
    var ft=floatingTexts[fi];
    ctx.globalAlpha=clamp(ft.life/40,0,1);
    ctx.fillStyle=ft.color;
    ctx.fillText(ft.text,ft.x,ft.y);
  }
  ctx.globalAlpha=1;
  ctx.restore();

  // Notification
  if(notification.timer>0){
    ctx.save();
    ctx.globalAlpha=clamp(notification.timer/60,0,1);
    ctx.fillStyle=notification.color;
    ctx.font='bold 16px "Courier New",Courier,monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(notification.text,W/2,HUD_H+35);
    ctx.globalAlpha=1;
    ctx.restore();
  }

  // Combo
  if(combo>=3){
    ctx.save();
    ctx.fillStyle='#ffff00';
    ctx.font='bold 18px "Courier New",Courier,monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowBlur=10;ctx.shadowColor='#ffff00';
    ctx.fillText('COMBO \u00d7'+combo+'!',W/2,HUD_H+55);
    ctx.shadowBlur=0;ctx.shadowColor='transparent';
    ctx.restore();
  }

  // Hard mode timer
  if(mode==='hard'){
    ctx.save();
    var remaining=Math.max(0,120-levelTimer);
    ctx.fillStyle=remaining<20?'#ff4444':'#666666';
    ctx.font='11px "Courier New",Courier,monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(Math.ceil(remaining)+'s',W/2,HUD_H-6);
    ctx.restore();
  }

  // Screen flash
  if(screenFlash&&screenFlash.frames>0){
    ctx.save();
    ctx.fillStyle=screenFlash.color;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  ctx.restore();
}

function renderShop(){
  ctx.save();

  ctx.fillRect(0,0,W,H);
  drawGrid();
  drawStars();
  ctx.fillStyle='#ffe600';
  ctx.font='bold 26px "Courier New",Courier,monospace';

  ctx.fillStyle='#00f5ff';
  ctx.font='13px "Courier New",Courier,monospace';
  ctx.fillText('ZONE '+zone+' • LEVEL '+(level+1),240,92);
  ctx.fillStyle='#ffffff';
  ctx.font='12px "Courier New",Courier,monospace';
  ctx.fillText('Your score: '+score+' pts   Cost: 10 pts each',240,118);
  ctx.fillText(shopBought?'Powerup purchased! Enter level.':'Buy ONE powerup before the level starts:',240,140);
  // Draw powerup shop grid (5x2)
  shopButtons=[];
  var cols=5,rows=2,bw=84,bh=54,gap=6;
  var gridW=cols*(bw+gap)-gap;
  var startX=(W-gridW)/2;
  var startY=165;
  for(var pi=0;pi<POWERUP_DEFS.length;pi++){
    var def=POWERUP_DEFS[pi];
    var col=pi%cols,row=Math.floor(pi/cols);
    var bx=startX+col*(bw+gap);
    var by=startY+row*(bh+gap);
    var hov=isInside(mouseX,mouseY,{x:bx,y:by,w:bw,h:bh});
    var canBuy=!shopBought&&score>=10;
    ctx.save();
    ctx.fillStyle=canBuy?(hov?def.color+'cc':def.color+'88'):'#222222';
    drawRoundRect(bx,by,bw,bh,6);ctx.fill();
    ctx.strokeStyle=canBuy?def.color:'#444444';ctx.lineWidth=canBuy?(hov?3:2):1;
    drawRoundRect(bx,by,bw,bh,6);ctx.stroke();
    ctx.fillStyle=canBuy?'#000000':'#666666';
    ctx.font='bold 15px "Courier New",Courier,monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(def.label,bx+bw/2,by+bh/2-8);
    ctx.font='10px "Courier New",Courier,monospace';
    ctx.fillText(def.type,bx+bw/2,by+bh/2+8);
    ctx.fillStyle=canBuy?'#ffe600':'#555555';
    ctx.font='9px "Courier New",Courier,monospace';
    ctx.fillText('10 pts',bx+bw/2,by+bh-7);
    ctx.restore();
    shopButtons.push({x:bx,y:by,w:bw,h:bh,def:def,action:function(d){return function(){
      if(shopBought||score<10)return;
      score-=10;shopBought=true;
      applyPowerup({type:d.type,color:d.color,label:d.label});
      notification={text:d.type+' READY!',timer:120,color:d.color};
    };}(def)});
  }
  // Skip / Enter level button
  var skipBtn={x:140,y:startY+rows*(bh+gap)+20,w:200,h:44,label:shopBought?'ENTER LEVEL ►':'SKIP SHOP ►',borderColor:shopBought?'#00ff88':'#aaaaaa',
    action:function(){state='PLAYING';loadLevel(level);}};
  drawButton(skipBtn,isInside(mouseX,mouseY,skipBtn));
  shopButtons.push(skipBtn);
  ctx.restore();
}

// === START GAME ===
function startGame(){
  vpArcadeRun=crypto.randomUUID();vpArcadeSend({type:'vp-arcade-start',game:'synthbreak',run:vpArcadeRun,mode:mode});
  score=0;level=0;zone=1;combo=0;lastBreakTime=0;
  lives=mode==='normal'?5:3;
  particles=[];floatingTexts=[];activePowerups=[];
  paddleX=200;paddleW=mode==='normal'?80:70;
  initAudio();
  shopBought=false;
  state='ZONE_INTRO';
  zoneIntroTimer=2.5;
}

// === INPUT ===
function pointerToGame(clientX,clientY){
  var rect=c.getBoundingClientRect();
  return {x:(clientX-rect.left)*(W/rect.width),y:(clientY-rect.top)*(H/rect.height)};
}

function handleGamePress(cx,cy){
  initAudio();
  mouseX=cx;mouseY=cy;
  if(state==='MENU'){
    for(var i=0;i<menuButtons.length;i++){if(isInside(cx,cy,menuButtons[i])){menuButtons[i].action();return;}}
  } else if(state==='HOW_TO_PLAY'){
    for(var i=0;i<howToPlayBtn.length;i++){if(isInside(cx,cy,howToPlayBtn[i])){howToPlayBtn[i].action();return;}}
  } else if(state==='HIGH_SCORES'){
    for(var i=0;i<highScoreBtn.length;i++){if(isInside(cx,cy,highScoreBtn[i])){highScoreBtn[i].action();return;}}
  } else if(state==='PAUSED'){
    for(var i=0;i<pauseButtons.length;i++){if(isInside(cx,cy,pauseButtons[i])){pauseButtons[i].action();return;}}
  } else if(state==='LEVEL_COMPLETE'){
    for(var i=0;i<lcButtons.length;i++){if(isInside(cx,cy,lcButtons[i])){lcButtons[i].action();return;}}
  } else if(state==='GAME_OVER'){
    for(var i=0;i<goButtons.length;i++){if(isInside(cx,cy,goButtons[i])){goButtons[i].action();return;}}
  } else if(state==='VICTORY'){
    for(var i=0;i<vicButtons.length;i++){if(isInside(cx,cy,vicButtons[i])){vicButtons[i].action();return;}}
  } else if(state==='CONTINUE_SCREEN'){
    for(var i=0;i<continueButtons.length;i++){if(isInside(cx,cy,continueButtons[i])){continueButtons[i].action();return;}}
  } else if(state==='SHOP'){
    for(var i=0;i<shopButtons.length;i++){if(isInside(cx,cy,shopButtons[i])){shopButtons[i].action();return;}}
  } else if(state==='ZONE_INTRO'){
    for(var i=0;i<zoneIntroBtn.length;i++){if(isInside(cx,cy,zoneIntroBtn[i])){zoneIntroBtn[i].action();return;}}
  } else if(state==='PLAYING'){
    if(cx>W-50&&cy<20){sfxEnabled=!sfxEnabled;return;}
    if(ballStuck){launchBall();return;}
    if(laserActive&&laserCooldown<=0){
      lasers.push({x:paddleX+paddleW*0.25,y:paddleY-4,vy:-10});
      lasers.push({x:paddleX+paddleW*0.75,y:paddleY-4,vy:-10});
      laserCooldown=0.18;playSFX('wall');
    }
  }
}

c.addEventListener('mousedown',function(e){
  if(e.button!==0)return;mouseHeld=true;
  var p=pointerToGame(e.clientX,e.clientY);mouseX=p.x;mouseY=p.y;
});
c.addEventListener('mouseup',function(e){if(e.button===0)mouseHeld=false;});
c.addEventListener('mouseleave',function(){mouseHeld=false;});
c.addEventListener('mousemove',function(e){var p=pointerToGame(e.clientX,e.clientY);mouseX=p.x;mouseY=p.y;});
c.addEventListener('click',function(e){var p=pointerToGame(e.clientX,e.clientY);handleGamePress(p.x,p.y);c.focus({preventScroll:true});});

var touchStartX=0,touchStartY=0,touchMoved=false;
c.addEventListener('touchstart',function(e){
  if(!e.touches||!e.touches.length)return;e.preventDefault();initAudio();
  var t=e.touches[0],p=pointerToGame(t.clientX,t.clientY);
  mouseX=p.x;mouseY=p.y;touchStartX=p.x;touchStartY=p.y;touchMoved=false;mouseHeld=true;c.focus({preventScroll:true});
},{passive:false});
c.addEventListener('touchmove',function(e){
  if(!e.touches||!e.touches.length)return;e.preventDefault();
  var t=e.touches[0],p=pointerToGame(t.clientX,t.clientY);
  mouseX=p.x;mouseY=p.y;if(Math.abs(p.x-touchStartX)>4||Math.abs(p.y-touchStartY)>4)touchMoved=true;
},{passive:false});
c.addEventListener('touchend',function(e){e.preventDefault();mouseHeld=false;if(!touchMoved)handleGamePress(mouseX,mouseY);},{passive:false});
c.addEventListener('touchcancel',function(){mouseHeld=false;},{passive:false});

document.addEventListener('keydown',function(e){
  keysDown[e.code]=true;initAudio();
  if(e.code==='Space'){e.preventDefault();if(state==='PLAYING'&&ballStuck)launchBall();}
  if(e.code==='KeyP'||e.code==='Escape'){if(state==='PLAYING')state='PAUSED';else if(state==='PAUSED')state='PLAYING';}
  if(e.code==='KeyZ'&&state==='PLAYING'&&laserActive&&laserCooldown<=0){
    lasers.push({x:paddleX+paddleW*0.25,y:paddleY-4,vy:-10});
    lasers.push({x:paddleX+paddleW*0.75,y:paddleY-4,vy:-10});
    laserCooldown=0.18;playSFX('wall');
  }
});
document.addEventListener('keyup',function(e){keysDown[e.code]=false;});
document.addEventListener('visibilitychange',function(){if(document.hidden&&state==='PLAYING')state='PAUSED';});

// === GAME LOOP ===
lastTime=null;
function gameLoop(ts){
  requestAnimationFrame(gameLoop);
  var dt=lastTime?Math.min((ts-lastTime)/1000,0.05):0.016;
  lastTime=ts;
  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
  ctx.shadowColor='transparent';
  try{update(dt);}catch(e){console.error('update:',e);}
  try{render();}catch(e){console.error('render:',e);}
}
requestAnimationFrame(gameLoop);

})();
</script>
